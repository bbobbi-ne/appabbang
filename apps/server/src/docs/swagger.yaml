                    description: 주문차수명
                    example: 주문 1차
                  startedAt:
                    type: string
                    format: date-time
                    description: 시작일시
                    example: 2025-07-01T11:00:00.000Z
                  endedAt:
                    type: string
                    format: date-time
                    description: 종료일시
                    example: 2025-07-31T11:00:00.000Z
                  minOrderQty:
                    type: integer
                    description: 최소주문수량
                    example: 1
                  maxOrderQty:
                    type: integer
                    description: 최대주문수량
                    example: 1
                  orderRoundBreads:
                    type: array
                    description: 주문 차수 내 빵 목록
                    items:
                      type: object
                      required:
                        - no
                        - name
                        - description
                        - breadStatus
                        - unitPrice
                      properties:
                        no:
                          type: integer
                          description: 빵 번호
                          example: 1
                        name:
                          type: string
                          description: 빵 이름
                          example: 단팥빵
                        description:
                          type: string
                          description: 빵 설명
                          example: 부드러운 단팥이 들어간 빵
                        breadStatus:
                          type: string
                          description: 빵 상태 (예: 10=판매중, 50=출시예정)
                          example: "10"
                        unitPrice:
                          type: integer
                          description: 가격
                          example: 1000
                  image:
                    type: object
                    required:
                      - url
                      - publicId
                      - order
                    properties:
                      url:
                        type: string
                        description: 이미지 URL
                        example: "https://example.com/image.jpg"
                      publicId:
                        type: string
                        description: 이미지 식별자
                        example: "breads/zvypj6wohag9dghdtdto"
                      order:
                        type: integer
                        description: 이미지 순서
                        example: 1

    put:
      tags: [OrderRound]
      summary: 주문차수 수정
      description: 기존 주문차수의 정보를 수정합니다. 이미지 업로드가 선택적으로 가능합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: no
          required: true
          schema:
            type: integer
          description: 주문차수 번호
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - no
                - orderRoundNo
                - name
                - startedAt
                - endedAt
                - minOrderQty
                - maxOrderQty
                - orderRoundBreads
              properties:
                no:
                  type: integer
                  description: 주문차수 번호
                  example: 1
                orderRoundNo:
                  type: integer
                  description: 주문차수
                  example: 1
                name:
                  type: string
                  description: 주문차수명
                  example: '주문 1차'
                startedAt:
                  type: string
                  format: date-time
                  description: 시작일시
                  example: 2025-07-01T11:00:00.000Z
                endedAt:
                  type: string
                  format: date-time
                  description: 종료일시
                  example: 2025-07-31T11:00:00.000Z
                minOrderQty:
                    type: integer
                    description: 최소주문수량
                    example: 1
                maxOrderQty:
                  type: integer
                  description: 최대주문수량
                  example: 1
                orderRoundBreads:
                  type: array
                  description: 빵 번호 목록 (JSON 문자열 형태로 전송)
                  example: '[{"no": 1, "name": "판매빵"}, {"no": 5, "name": "출시예정빵"}]'
                image:
                  type: string
                  format: binary
                  description: 주문차수 이미지(선택사항)
      responses:
        '200':
          description: 주문차수 수정 성공
        '500':
          description: 주문차수 수정 실패(수정과정 중 오류가 발생함)

