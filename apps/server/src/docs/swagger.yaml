openapi: 3.0.0
info:
  title: Appabbang API
  version: 1.0.0
  description: 아빠빵 어드민 API 문서
  # contact:
  #   name: bbobbi-ne Team
  #   email: '-'
servers:
  - url: http://localhost:4000
    description: 개발 서버
  # - url: https://api.appabbang.com
  #   description: 운영 서버
tags:
  - name: Auth
    description: 인증 API
  - name: Breads
    description: 빵 API
  - name: Orders
    description: 주문 API
  - name: OrderRound
    description: 주문차수 API
  - name: Customers
    description: 고객 API
  - name: DeliveryMethods
    description: 배송 방법 API
  - name: CommonCodes
    description: 공통 코드 API
  - name: CommonImages
    description: 클라우디너리 이미지 API
  - name: Payments
    description: 결제 API
  - name: My
    description: 본인만 접근 가능한 API
  - name: Coupons
    description: 쿠폰 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 토큰을 Bearer 형식으로 전송하세요.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 관리자 또는 고객이 로그인을 수행합니다. (권한: 없음 - 누구나 접근 가능)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - pw
                - type
              properties:
                id:
                  type: string
                  description: 사용자 ID
                  example: admin
                pw:
                  type: string
                  description: 비밀번호
                  example: test1234!
                type:
                  type: string
                  description: 클라이언트 타입 (user, client)
                  example: 'user'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: 리프레시 토큰이 쿠키로 설정됩니다
              schema:
                type: string
                example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - accessToken
                properties:
                  data:
                    type: object
                    required:
                      - no
                      - id
                      - name
                      - pw
                    properties:
                      no:
                        type: integer
                        description: 사용자 번호
                        example: 1
                      id:
                        type: string
                        description: 사용자 ID
                        example: ghrn9933
                      name:
                        type: string
                        description: 사용자 이름
                        example: 테스트빵
                      pw:
                        type: string
                        description: 해시된 비밀번호
                        example: $2b$12$/gk8toAIQVaIr3jiZuPiM.whSYPOnqqEerBiw47lGLXKCt.MVZp9K
                  accessToken:
                    type: string
                    description: 액세스 토큰
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      description: 현재 로그인한 클라이언트의 정보를 조회합니다. (권한: 로그인 필요 - 관리자/고객 모두)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - no
                  - id
                  - name
                  - type
                  - iat
                  - exp
                properties:
                  no:
                    type: number
                    description: 사용자키
                    example: 1
                  id:
                    type: string
                    description: 사용자 ID
                    example: admin
                  name:
                    type: string
                    description: 사용자 이름
                    example: 관리자
                  userRole:
                    type: string
                    enum: ['10', '20']
                    description: '관리자 역할 (10-관리자, 20-서브관리자)'
                    example: '10'
                  type:
                    type: string
                    description: 클라이언트 타입 (user, client)
                    example: 'user'
                  iat:
                    type: number
                    description: 토큰 발급 시간
                    example: 1715000000
                  exp:
                    type: number
                    description: 토큰 만료 시간
                    example: 1715000000

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 액세스 토큰 재발급
      description: 쿠키의 리프레시 토큰을 사용하여 새로운 액세스 토큰을 발급받습니다. (권한: 없음 - 누구나 접근 가능)
      responses:
        '200':
          description: 액세스 토큰 재발급 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                properties:
                  accessToken:
                    type: string
                    description: 새로운 액세스 토큰
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 현재 로그인한 사용자를 로그아웃 처리합니다. (권한: 로그인 필요 - 관리자/고객 모두)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 성공 메시지
                    example: '로그아웃되었습니다.'
  /breads:
    get:
      tags: [Breads]
      summary: 빵 목록 조회
      description: 빵 목록을 조회합니다. (권한: 선택적 로그인 - 어드민은 추가 정보 제공)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 빵 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - no
                    - name
                    - description
                    - unitPrice
                    - breadStatus
                    - breadStatusName
                    - countryOfOrigin
                    - allergyInfo
                    - createdAt
                    - updatedAt
                  properties:
                    no:
                      type: integer
                      description: 빵 번호
                      example: 1
                    name:
                      type: string
                      description: 빵 이름
                      example: '크로아상'
                    description:
                      type: string
                      description: 빵 설명
                      example: '바삭한 크로아상'
                    unitPrice:
                      type: integer
                      description: 단가
                      example: 3000
                    breadStatus:
                      type: string
                      enum: ['10', '20', '30', '40', '50']
                      description: '빵 상태 (10-판매, 20-미판매, 30-임시저장, 40-재료소진, 50-출시예정)'
                      example: '10'
                    breadStatusName:
                      type: string
                      description: '빵 상태 이름'
                      example: '판매'
                    countryOfOrigin:
                      type: string
                      description: 원산지
                      example: '빵류[밀가루(밀:미국,캐나다산),영양강화밀가루(프랑스산)],가공유크림(독일산)'
                    allergyInfo:
                      type: string
                      description: 알레르기 정보
                      example: '밀, 우유, 대두, 계란 함유'
                    createdAt:
                      type: string
                      format: date-time
                      description: '생성일시'
                      example: '2024-01-01T00:00:00.000Z'
                    updatedAt:
                      type: string
                      format: date-time
                      description: '수정일시'
                      example: '2024-01-01T00:00:00.000Z'
                    images:
                      type: object
                      description: 빵 이미지 목록 중 첫 번째 이미지
                      required:
                        - url
                      properties:
                        url:
                          type: string
                          description: 이미지 URL
                          example: 'https://example.com/image.jpg'

    post:
      tags: [Breads]
      summary: 빵 등록
      description: 새로운 빵을 등록합니다. 이미지 업로드가 선택적으로 가능합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - unitPrice
                - breadStatus
                - countryOfOrigin
                - allergyInfo
              properties:
                name:
                  type: string
                  description: 빵 이름
                  example: '크로아상'
                description:
                  type: string
                  description: 빵 설명
                  example: '바삭한 크로아상'
                unitPrice:
                  type: integer
                  description: 단가
                  example: 3000
                breadStatus:
                  type: string
                  enum: ['10', '20', '30', '40', '50']
                  description: '빵 상태 (10-판매, 20-미판매, 30-임시저장, 40-재료소진, 50-출시예정)'
                  example: '10'
                countryOfOrigin:
                  type: string
                  description: 원산지
                  example: '빵류[밀가루(밀:미국,캐나다산),영양강화밀가루(프랑스산)],가공유크림(독일산)'
                allergyInfo:
                  type: string
                  description: 알레르기 정보
                  example: '밀, 우유, 대두, 계란 함유'
                image:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 빵 이미지 (선택사항)
      responses:
        '201':
          description: 빵 등록 성공

    delete:
      tags: [Breads]
      summary: 빵 삭제 (여러건)
      description: 여러 빵을 한 번에 삭제합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - noList
              properties:
                noList:
                  type: array
                  items:
                    type: integer
                  description: 삭제할 빵 번호 목록
                  example: [1, 2, 3]
      responses:
        '204':
          description: 빵 삭제 성공

  /breads/{no}:
    get:
      tags: [Breads]
      summary: 빵 상세 조회
      description: 특정 빵의 상세 정보를 조회합니다. (권한: 선택적 로그인 - 어드민은 추가 정보 제공)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: no
          required: true
          schema:
            type: integer
          description: 빵 번호
          example: 1
      responses:
        '200':
          description: 빵 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - no
                  - name
                  - unitPrice
                  - breadStatus
                  - breadStatusName
                  - images
                  - countryOfOrigin
                  - allergyInfo
                  - createdAt
                  - updatedAt
                properties:
                  no:
                    type: integer
                    description: 빵 번호
                    example: 1
                  name:
                    type: string
                    description: 빵 이름
                    example: '크로아상'
                  description:
                    type: string
                    description: 빵 설명
                    example: '바삭한 크로아상'
                  unitPrice:
                    type: integer
                    description: 단가
                    example: 3000
                  breadStatus:
                    type: string
                    enum: ['10', '20', '30', '40', '50']
                    description: '빵 상태 (10-판매, 20-미판매, 30-임시저장, 40-재료소진, 50-출시예정)'
                    example: '10'
                  breadStatusName:
                    type: string
                    description: '빵 상태 이름'
                    example: '판매'
                  countryOfOrigin:
                    type: string
                    description: 원산지
                    example: '빵류[밀가루(밀:미국,캐나다산),영양강화밀가루(프랑스산)],가공유크림(독일산)'
                  allergyInfo:
                    type: string
                    description: 알레르기 정보
                    example: '밀, 우유, 대두, 계란 함유'
                  createdAt:
                    type: string
                    format: date-time
                    description: '생성일시'
                    example: '2024-01-01T00:00:00.000Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: '수정일시'
                    example: '2024-01-01T00:00:00.000Z'
                  images:
                    type: array
                    description: 빵 이미지 목록 (모든 이미지 포함, order 순으로 정렬)
                    items:
                      type: object
                      required:
                        - order
                      properties:
                        publicId:
                          type: string
                          description: 이미지 공개 ID (Cloudinary)
                          example: 'bread_123'
                        url:
                          type: string
                          description: 이미지 URL 
                          example: 'https://example.com/image.jpg'
                        order:
                          type: integer
                          description: 이미지 순서
                          example: 1

    put:
      tags: [Breads]
      summary: 빵 수정
      description: 기존 빵의 정보를 수정합니다. 이미지 업로드가 선택적으로 가능합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: no
          required: true
          schema:
            type: integer
          description: 빵 번호
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - unitPrice
                - breadStatus
                - countryOfOrigin
                - allergyInfo
              properties:
                name:
                  type: string
                  description: 빵 이름
                  example: '크로아상'
                description:
                  type: string
                  description: 빵 설명
                  example: '바삭한 크로아상'
                unitPrice:
                  type: integer
                  description: 단가
                  example: 3000
                breadStatus:
                  type: string
                  enum: ['10', '20', '30', '40', '50']
                  description: '빵 상태 (10-판매, 20-미판매, 30-임시저장, 40-재료소진, 50-출시예정)'
                  example: '10'
                countryOfOrigin:
                  type: string
                  description: 원산지
                  example: '빵류[밀가루(밀:미국,캐나다산),영양강화밀가루(프랑스산)],가공유크림(독일산)'
                allergyInfo:
                  type: string
                  description: 알레르기 정보
                  example: '밀, 우유, 대두, 계란 함유'
                image:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 빵 이미지 (선택사항)
      responses:
        '200':
          description: 빵 수정 성공



  /breads/{no}/status:
    put:
      tags: [Breads]
      summary: 빵 상태 수정
      description: 빵의 상태만 수정합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: no
          required: true
          schema:
            type: integer
          description: 빵 번호
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - breadStatus
              properties:
                breadStatus:
                  type: string
                  enum: ['10', '20', '30', '40', '50']
                  description: '변경할 빵 상태 (10-판매, 20-미판매, 30-임시저장, 40-재료소진, 50-출시예정)'
                  example: '10'
      responses:
        '200':
          description: 빵 상태 수정 성공

  /breads/image:
    delete:
      tags: [Breads]
      summary: 빵 이미지 삭제
      description: 특정 빵의 이미지를 삭제합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicId
                - no
              properties:
                publicId:
                  type: string
                  description: 삭제할 이미지의 공개 ID
                  example: 'breads/image123'
                no:
                  type: number
                  description: 해당하는 빵의 No
                  example: '1'
      responses:
        '204':
          description: 이미지 삭제 성공

  /orders:
    get:
      tags: [Orders]
      summary: 주문 목록 조회
      description: 모든 주문 목록을 조회합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 주문 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - no
                    - address
                    - addressDetail
                    - deliveryMethodName
                    - orderNumber
                    - orderStatus
                    - orderStatusName
                    - ordererMobile
                    - ordererName
                    - recipientName
                    - totalPrice
                    - createdAt
                    - updatedAt
                  properties:
                    no:
                      type: integer
                      description: 주문 번호
                      example: 1
                    orderNumber:
                      type: string
                      description: 주문 고유번호
                      example: ORD-20240622-12345
                    orderStatus:
                      type: string
                      enum: ['10', '20', '30', '40', '50', '51', '52']
                      description: '주문 상태 (10-접수요청, 20-제조중, 30-배송중, 40-완료, 50-취소요청, 51-취소완료, 52-취소완료(환불))'
                      example: '10'
                    orderStatusName:
                      type: string
                      description: 주문 상태명
                      example: '접수요청'
                    ordererMobile:
                      type: string
                      description: 주문자 전화번호
                      example: '010-1234-5678'
                    ordererName:
                      type: string
                      description: 주문자 이름
                      example: '홍길동'
                    recipientName:
                      type: string
                      description: 수령인 이름
                      example: '홍길동'
                    totalPrice:
                      type: integer
                      description: 총 주문 금액
                      example: 15000
                    createdAt:
                      type: string
                      format: date-time
                      description: 주문 생성일시
                      example: '2024-06-22T12:34:56.000Z'
                    updatedAt:
                      type: string
                      format: date-time
                      description: 주문 수정일시
                      example: '2024-06-22T12:34:56.000Z'
                    address:
                      type: string
                      description: "주소"
                      example : "서울시 강남구"
                    addressDetail:
                      type: string
                      description: "상세 주소"
                      example : "123-45"
                    deliveryMethodName:
                      type: string
                      description: "배송방법"
                      example : "우체국"
                    zipcode:
                      type: string
                      description: "우편번호"
                      example : "12345"
                    payment:
                      type: object
                      properties:
                        isPaid:
                          type: boolean
                          description: 입금 확인 여부
                          example: false

    post:
      tags: [Orders]
      summary: 주문 생성 (비회원)
      description: 비회원 주문을 생성합니다. (권한: 없음 - 누구나 접근 가능)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                [필수값 안내]
                - 비회원 주문: ordererName, ordererMobile, recipientName, recipientMobile, address, addressDetail, zipcode, message, orderRoundNo, totalPrice, orderPw, isServiceTermsAgreed, isPrivacyTermsAgreed, deliveryMethodNo, orderItems, bankCode, accountNumber, accountHolderName
                - 회원 주문: ordererName, ordererMobile, recipientName, recipientMobile, address, addressDetail, zipcode, message, orderRoundNo, totalPrice, deliveryMethodNo, orderItems, bankCode, accountNumber, accountHolderName, customerCouponNo (선택)
                (상세 예시는 아래 examples 참고)
              type: object
              required:
                - ordererName
                - ordererMobile
                - recipientName
                - recipientMobile
                - address
                - addressDetail
                - zipcode
                - message
                - orderRoundNo
                - totalPrice
                - deliveryMethodNo
                - orderItems
                - bankCode
                - accountNumber
                - accountHolderName
                - isPaymentRefundTermsAgreed
              properties:
                ordererName:
