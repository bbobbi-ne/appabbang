                - endedAt
                - breadNoList
              properties:
                name:
                  type: string
                  description: 주문차수명
                  example: '주문 1차'
                startedAt:
                  type: string
                  format: date-time
                  description: 시작일시
                  example: 2025-07-01T11:00:00.000Z
                endedAt:
                  type: string
                  format: date-time
                  description: 종료일시
                  example: 2025-07-31T11:00:00.000Z
                breadNoList:
                  type: array
                  description: 빵 번호 목록 (JSON 문자열 형태로 전송)
                  example: '[{"breadNo": 1}, {"breadNo": 2}, {"breadNo": 3}]'
                  items:
                    type: object
                    required:
                      breadNo
                    properties:
                      breadNo:
