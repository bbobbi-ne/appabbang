                      type: integer
                      nullable: true
                      description: 기본 배송지 번호
                      example: 101
                    address:
                      type: array
                      description: 고객 주소 목록
                      items:
                        type: object
                        properties:
                          no:
                            type: integer
                            description: 주소 번호
                            example: 1
                          address:
                            type: string
                            description: 기본 주소
                            example: "서울시 강남구"
                          addressDetail:
                            type: string
                            description: 상세 주소
                            example: "123-45"
                          zipcode:
                            type: string
                            description: 우편번호
                            example: "12345"
                          message:
                            type: string
                            description: 배송 메시지
                            example: "문 앞에 놓아주세요."
                          createdAt:
                            type: string
                            format: date-time
                            description: 생성일시
                            example: "2024-01-01T00:00:00.000Z"
                          updatedAt:
                            type: string
                            format: date-time
                            description: 수정일시
                            example: "2024-01-01T00:00:00.000Z"

    post:
      tags: [Customers]
      summary: 고객 생성 (회원가입)
      description: 새로운 고객을 생성합니다. (권한: 없음 - 누구나 접근 가능)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - pw
                - name
                - email
                - mobileNumber
                - address
                - addressDetail
                - zipcode
                - isServiceTermsAgreed
                - isPrivacyTermsAgreed
                - isMarketingTermsAgreed
              properties:
                id:
                  type: string
                  description: 고객 ID
                  example: 'customer123'
                pw:
                  type: string
                  description: 비밀번호
                  example: 'test1234!'
                name:
                  type: string
                  description: 고객명
                  example: '홍길동'
                email:
                  type: string
                  description: 이메일
                  example: 'test1231@naver.com'
                mobileNumber:
                  type: string
                  description: 전화번호
                  example: '010-1234-5678'
                address:
                  type: string
                  description: 주소
                  example: '서울시 강남구'
                addressDetail:
                  type: string
                  description: 상세주소
                  example: '123-45'
                zipcode:
                  type: string
                  description: 우편번호
                  example: '12345'
                isServiceTermsAgreed:
                  type: boolean
                  description: 서비스 이용약관 동의여부
                  example: true
                isPrivacyTermsAgreed:
                  type: boolean
                  description: 개인정보 수집, 이용 동의여부
                  example: true
                isMarketingTermsAgreed:
                  type: boolean
                  description: 마케팅 정보 수신 동의여부
                  example: true
      responses:
        '201':
          description: 고객 생성 성공
          headers:
            Set-Cookie:
              description: 리프레시 토큰이 쿠키로 설정됩니다
              schema:
                type: string
                example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - accessToken
                properties:
                  data:
                    type: object
                    required:
                      - no
                      - id
                      - name
                      - email
                      - mobileNumber
                      - isServiceTermsAgreed
                      - isPrivacyTermsAgreed
                      - isMarketingTermsAgreed
                      - createdAt
                      - updatedAt
                    properties:
                      no:
                        type: integer
                        description: 생성된 고객 번호
                        example: 1
                      id:
                        type: string
                        description: 고객 ID
                        example: 'customer123'
                      name:
                        type: string
                        description: 고객명
                        example: '홍길동'
                      email: 
                        type: string
                        description: 이메일
                        example: 'test1231@naver.com'
                      mobileNumber:
                        type: string
                        description: 전화번호
                        example: '010-1234-5678'
                      isServiceTermsAgreed:
                        type: boolean
                        description: 서비스 이용약관 동의여부
                        example: true
                      isPrivacyTermsAgreed:
                        type: boolean
                        description: 개인정보 수집, 이용 동의여부
                        example: true
                      isMarketingTermsAgreed:
                        type: boolean
                        description: 마케팅 정보 수신 동의여부
                        example: true
                      createdAt:
                        type: string
                        format: date-time
                        description: '생성일시'
                        example: '2024-01-01T00:00:00.000Z'
                      updatedAt:
                        type: string
                        format: date-time
                        description: '수정일시'
                        example: '2024-01-01T00:00:00.000Z'
                  accessToken:
                    type: string
                    description: 액세스 토큰
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

