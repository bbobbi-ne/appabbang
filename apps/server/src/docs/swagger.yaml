                      example: "user01"
                    name:
                      type: string
                      description: 고객명
                      example: "홍길동"
                    mobileNumber:
                      type: string
                      description: 전화번호
                      example: "010-1234-5678"
                    email:
                      type: string
                      description: 이메일
                      example: "test@example.com"
