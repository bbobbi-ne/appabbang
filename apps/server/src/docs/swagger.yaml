  /order-round:
    get:
      tags: [OrderRound]
      summary: 주문차수 목록 조회
      description: 모든 주문차수 목록을 조회합니다. (권한: 관리자만)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 주문차수 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - no
                    - name
                    - startedAt
                    - endedAt
                    - minOrderQty
                    - maxOrderQty
                    - orderRoundBreads
                    - image
                  properties:
                    no:
                      type: integer
                      description: 주문차수 번호
                      example: 1
                    name:
                      type: string
                      description: 주문차수명
                      example: 주문 1차
                    startedAt:
                      type: string
                      format: date-time
                      description: 시작일시
                      example: 2025-07-01T11:00:00.000Z
                    endedAt:
                      type: string
                      format: date-time
                      description: 종료일시
                      example: 2025-07-31T11:00:00.000Z
                    minOrderQty:
                      type: integer
                      description: 최소주문수량
                      example: 1
                    maxOrderQty:
                      type: integer
                      description: 최대주문수량
                      example: 999
                    orderRoundBreads:
                      type: array
                      items:
                        type: object
                        required:
                          - no
                          - name
                        properties:
                          no:
                            type: integer
                            description: 빵 번호
                            example: 1
                          name:
                            type: string
                            description: 빵 이름
                            example: 판매빵
                    image:
                      type: array
                      items:
                        type: object
                        properties:
                          url: 
                            type: string
                            description: 이미지 URL
                            example: 'https://example.com/image.jpg'

    post:
      tags: [OrderRound]
      summary: 주문차수 등록
      description: 새로운 주문차수를 등록합니다. 이미지 업로드가 선택적으로 가능합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - startedAt
                - endedAt
                - minOrderQty
                - maxOrderQty
                - orderRoundBreads
              properties:
                name:
                  type: string
                  description: 주문차수명
                  example: '주문 1월'
                startedAt:
                  type: string
                  format: date-time
                  description: 시작일시
                  example: 2025-01-01T11:00:00.000Z
                endedAt:
                  type: string
                  format: date-time
                  description: 종료일시
                  example: 2025-01-31T11:00:00.000Z
                minOrderQty:
                  type: integer
                  description: 최소주문수량
                  example: 1
                maxOrderQty:
                  type: integer
                  description: 최대주문수량
                  example: 1
                orderRoundBreads:
                  type: array
                  description: 빵 번호 목록 (JSON 문자열 형태로 전송)
                  example: '[{"no": 1, "name": "판매빵"}, {"no": 5, "name": "출시예정빵"}]'
                image:
                  type: string
                  format: binary
                  description: 주문차수 이미지(선택사항)
      responses:
        '201':
          description: 주문차수 등록 성공
        '500':
          description: 주문차수 등록 실패(등록과정 중 오류가 발생할 경우)

